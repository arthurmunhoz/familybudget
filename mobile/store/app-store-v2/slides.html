<!doctype html>
<html><head><meta charset="utf-8">
<!--
  App Store screenshots, v2 ("direction A": warm wash, straight phone cropped
  at the bottom, 1–2 pop-outs breaking out of the frame). One page renders ONE
  slide: slides.html?slide=<id>&lang=<en|es|pt>. CSS canvas 660×1434, shot at
  2x = 1320×2868, Apple's 6.9" iPhone size. Copy lives in copy.js; real app
  captures in shots/<id>.png (1320×2868, iPhone 17 Pro Max simulator).
  Render everything with render.sh.
-->
<style>
@font-face { font-family:'Nunito'; src:url('fonts/nunito-800.ttf'); font-weight:800; }
@font-face { font-family:'Nunito'; src:url('fonts/nunito-700.ttf'); font-weight:700; }
@font-face { font-family:'Hanken'; src:url('fonts/hanken-400.ttf'); font-weight:400; }
@font-face { font-family:'Hanken'; src:url('fonts/hanken-600.ttf'); font-weight:600; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:660px; height:1434px; overflow:hidden; }
body { font-family:'Hanken', system-ui, sans-serif; color:#241F1B; -webkit-font-smoothing:antialiased; }

.stage { position:relative; width:660px; height:1434px; overflow:hidden; background:var(--base); }
.blob { position:absolute; border-radius:50%; filter:blur(70px); }

/* ---- headline ---- */
.copy { position:absolute; top:96px; left:44px; right:44px; text-align:center; z-index:5; }
.eyebrow { display:inline-flex; align-items:center; gap:8px; font:600 17px/1 'Hanken'; letter-spacing:2.6px;
  text-transform:uppercase; color:var(--accent); padding:9px 16px; border-radius:999px; background:var(--chip); }
.eyebrow svg { width:18px; height:18px; }
h1 { margin-top:22px; font:800 62px/1.06 'Nunito'; letter-spacing:-1.2px; color:var(--ink); text-wrap:balance; }
.ai h1 mark { background:linear-gradient(90deg,#FFC48A,#FF8A4C); -webkit-background-clip:text; color:transparent; padding:0; margin:0; }
h1 mark { color:inherit; background:linear-gradient(transparent 60%, var(--hl) 60%, var(--hl) 90%, transparent 90%);
  padding:0 4px; margin:0 -4px; border-radius:4px; }

/* ---- phone ---- */
.phone { position:absolute; left:50%; top:388px; width:548px; transform:translateX(-50%);
  border-radius:84px; padding:13px; background:linear-gradient(145deg,#3a3633,#141211 40%,#26221f);
  box-shadow:0 0 0 2px #5b5550 inset, 0 40px 80px -20px rgba(60,30,10,.45), 0 12px 30px rgba(60,30,10,.18); z-index:2; }
.screen { position:relative; border-radius:71px; overflow:hidden; aspect-ratio:1320/2868; background:#F7EFE6; }
.screen img { display:block; width:100%; height:100%; object-fit:cover; }
.island { position:absolute; top:19px; left:50%; transform:translateX(-50%); width:128px; height:37px;
  border-radius:20px; background:#000; z-index:3; }

/* ---- pop-outs ---- */
.pop { position:absolute; z-index:6; background:rgba(255,255,255,.96); border-radius:24px;
  box-shadow:0 22px 50px -12px rgba(70,35,15,.32), 0 4px 12px rgba(70,35,15,.10); }
.icon { display:inline-flex; align-items:center; justify-content:center; flex:none; }
.icon svg { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* notification (iOS banner look) */
.notif { display:flex; gap:14px; align-items:center; padding:16px 18px; border-radius:30px;
  background:rgba(250,246,242,.94); backdrop-filter:blur(20px); width:520px; }
.notif .appic { width:52px; height:52px; border-radius:13px; flex:none; background:url('assets/icon.png') center/cover; }
.notif .meta { display:flex; justify-content:space-between; font:600 17px 'Hanken'; color:#241F1B; }
.notif .meta span { font-weight:400; color:#8a8078; }
.notif .msg { font:400 19px/1.3 'Hanken'; color:#241F1B; margin-top:3px; }

.chip { display:inline-flex; align-items:center; gap:9px; padding:12px 18px; border-radius:999px;
  font:600 18px 'Hanken'; background:#fff; box-shadow:0 14px 30px -10px rgba(70,35,15,.3); }

/* ---- AI art ---- */
.ai .viewfinder { position:absolute; left:52px; top:392px; width:330px; height:640px; z-index:2; transform:rotate(-4deg); }
.ai .corner { position:absolute; width:46px; height:46px; border:5px solid #F2884F; }
.ai .corner.tl { top:-14px; left:-14px; border-right:0; border-bottom:0; border-radius:14px 0 0 0; }
.ai .corner.tr { top:-14px; right:-14px; border-left:0; border-bottom:0; border-radius:0 14px 0 0; }
.ai .corner.bl { bottom:-14px; left:-14px; border-right:0; border-top:0; border-radius:0 0 0 14px; }
.ai .corner.br { bottom:-14px; right:-14px; border-left:0; border-top:0; border-radius:0 0 14px 0; }
.receipt { position:absolute; inset:0; background:#FFFDF8; padding:30px 28px 0;
  font:500 15px/1 'Courier New', monospace; color:#3b332d; letter-spacing:.4px;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 22px 100%;
  box-shadow:0 30px 60px rgba(0,0,0,.45); }
.receipt .rh { text-align:center; font-weight:700; font-size:21px; letter-spacing:3px; }
.receipt .rs { text-align:center; font-size:12px; color:#8b8077; margin-top:8px; }
.receipt hr { border:0; border-top:2px dashed #cfc6bd; margin:18px 0; }
.receipt .row { display:flex; justify-content:space-between; margin:11px 0; }
.receipt .tot { font-weight:700; font-size:21px; }
.receipt .bar { margin-top:24px; height:46px; background:repeating-linear-gradient(90deg,#3b332d 0 2px,transparent 2px 5px,#3b332d 5px 6px,transparent 6px 9px); opacity:.8; }
.beam { position:absolute; left:-30px; right:-30px; top:46%; height:8px; border-radius:8px; z-index:3;
  background:linear-gradient(90deg,transparent,#FFB37A 15%,#FFF1E2 50%,#FFB37A 85%,transparent);
  box-shadow:0 0 30px 10px rgba(255,150,80,.65), 0 0 90px 30px rgba(242,136,79,.35); }
.beamglow { position:absolute; left:0; right:0; top:calc(46% - 170px); height:170px; z-index:2;
  background:linear-gradient(transparent, rgba(255,170,110,.28)); }
.spark { position:absolute; z-index:4; color:#FFD3A8; filter:drop-shadow(0 0 12px rgba(255,170,100,.9)); }
.entry { position:absolute; right:28px; top:900px; width:372px; z-index:5; transform:rotate(3deg);
  background:#FBF4EC; border-radius:30px; padding:26px 26px 22px; box-shadow:0 40px 80px rgba(0,0,0,.5); }
.entry .hd { display:flex; align-items:center; gap:10px; font:700 17px 'Nunito'; color:#C9542C; }
.entry .amt { font:800 64px/1 'Nunito'; color:#241F1B; margin:14px 0 18px; letter-spacing:-1px; }
.entry .f { display:flex; align-items:center; gap:12px; padding:13px 0; border-top:1px solid rgba(60,45,38,.1); font:400 19px 'Hanken'; }
.entry .f b { font-weight:400; color:#73695F; width:96px; }
.entry .f .v { flex:1; font-weight:600; }
.entry .ok { width:28px; height:28px; border-radius:50%; background:#1F9E68; color:#fff; }
.arrow { position:absolute; z-index:3; left:262px; top:800px; width:200px; height:170px; }
.splitchip { white-space:nowrap; position:absolute; left:50%; transform:translateX(-50%); top:1330px; z-index:6;
  background:rgba(255,255,255,.1); color:#F7E6D8; border:1px solid rgba(255,255,255,.18); box-shadow:none; }
</style></head>
<body>
<div class="stage" id="stage"></div>
<script src="icons.js"></script>
<script src="copy.js"></script>
<script>
const q = new URLSearchParams(location.search)
const lang = q.get('lang') || 'en'
const id = q.get('slide') || 'hero'
const C = (window.COPY[lang] || window.COPY.en).slides.find((s) => s.id === id)
document.documentElement.lang = lang
const P = C.pops || {}

// Per-slide palette: a light wash in the app's own language (warm paper base,
// three soft blobs) with one feature hue doing the accent. `ai` is the one
// dark (Dusk) slide on purpose — it's the differentiator and should stop the scroll.
const THEMES = {
  hero:     { base:'#FBF1E8', blobs:['#FFC489','#FF9C80','#FFD98C'], accent:'#D2582F', hl:'rgba(255,156,128,.55)' },
  ai:       { base:'#1E1714', blobs:['#7A3216','#5A2A18','#8A4A1C'], accent:'#FFB37A', hl:'rgba(242,136,79,.55)', ink:'#FBF1E8', chip:'rgba(255,179,122,.14)' },
  calendar: { base:'#F4F0FB', blobs:['#CFC4FF','#FFC9B5','#E5D9FF'], accent:'#6B55D6', hl:'rgba(176,160,255,.55)' },
  shopping: { base:'#EEF8F1', blobs:['#BFEBD6','#FFE3A3','#CBEFE0'], accent:'#178A59', hl:'rgba(122,214,170,.6)' },
  money:    { base:'#FCF5E6', blobs:['#FFD98C','#FFC489','#FFE9B8'], accent:'#B8661A', hl:'rgba(255,200,110,.7)' },
  location: { base:'#EEF5FC', blobs:['#BFDDFF','#FFD0B8','#D6E9FF'], accent:'#2F72B8', hl:'rgba(140,195,255,.6)' },
  nudges:   { base:'#FDF0EC', blobs:['#FFB3A1','#FFD98C','#FFC9BC'], accent:'#D2582F', hl:'rgba(255,156,128,.55)' },
  pets:     { base:'#EFF8F6', blobs:['#B7E6DD','#FFD7A8','#CDEFE8'], accent:'#1F8577', hl:'rgba(120,210,195,.6)' },
  docs:     { base:'#F7F0FA', blobs:['#E2C8F2','#FFD0B8','#EEDCF8'], accent:'#8A4FB0', hl:'rgba(214,170,240,.6)' },
  family:   { base:'#FBF1E8', blobs:['#FFC489','#FFB3A1','#FFE0B0'], accent:'#D2582F', hl:'rgba(255,156,128,.55)' },
}
const ICON_FOR = { hero:'heart', ai:'sparkles', calendar:'calendar-days', shopping:'shopping-cart', money:'wallet',
  location:'map-pin', nudges:'bell', pets:'paw-print', docs:'folder-lock', family:'shield-check' }
const T = THEMES[id]
const stage = document.getElementById('stage')
stage.className = 'stage ' + id
stage.style.setProperty('--base', T.base)
stage.style.setProperty('--accent', T.accent)
stage.style.setProperty('--hl', T.hl)
stage.style.setProperty('--ink', T.ink || '#241F1B')
stage.style.setProperty('--chip', T.chip || 'rgba(255,255,255,.7)')

const icon = (n, size = 22, color) =>
  `<span class="icon" style="${color ? 'color:' + color : ''}"><svg viewBox="0 0 24 24" width="${size}" height="${size}">${ICONS[n] || ''}</svg></span>`
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
const title = esc(C.title).replace(/\*([^*]+)\*/g, '<mark>$1</mark>')

const BLOB_POS = [
  { l: -180, t: -160, s: 620 }, { l: 280, t: 520, s: 640 }, { l: -120, t: 980, s: 600 },
]
let html = T.blobs.map((c, i) => {
  const b = BLOB_POS[i]
  return `<div class="blob" style="left:${b.l}px;top:${b.t}px;width:${b.s}px;height:${b.s}px;background:${c};opacity:${id === 'ai' ? .55 : .75}"></div>`
}).join('')

html += `<div class="copy"><span class="eyebrow">${icon(ICON_FOR[id], 18)}${esc(C.eyebrow)}</span><h1>${title}</h1></div>`

const phone = (shot, extra = '') =>
  `<div class="phone" style="${extra}"><div class="screen"><div class="island"></div><img src="shots/${lang}/${shot}.png"></div></div>`

const notif = (top, rot, msg, sub) => `<div class="pop notif" style="left:70px;top:${top}px;transform:rotate(${rot}deg)">
  <div class="appic"></div><div style="flex:1;min-width:0"><div class="meta">${esc(P.app)}<span>${esc(P.when)}</span></div>
  <div class="msg">${esc(msg)}${sub ? `<br><span style="color:#8a8078;font-size:16px">${esc(sub)}</span>` : ''}</div></div></div>`

const LAYOUT = {
  hero() {
    // One pop-out, not a cloud of chips: the home screen already shows every
    // app, so the pop-out sells the "together" part instead.
    return phone('hero') + `<div class="pop" style="right:22px;top:1180px;padding:16px 22px 16px 16px;display:flex;gap:14px;align-items:center;transform:rotate(3deg)">
      <span style="width:56px;height:56px;border-radius:50%;background:#D9F1E4;color:#178A59;display:flex;align-items:center;justify-content:center;font:800 22px Nunito">${esc(P.who[0])}</span>
      <div><div style="font:400 18px Hanken"><b style="font-weight:600">${esc(P.who)}</b> ${esc(P.did)}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;font:800 21px Nunito;color:${T.accent}">${icon('shopping-cart', 20)}${esc(P.item)} <span style="font:400 15px Hanken;color:#8a8078">· ${esc(P.when)}</span></div></div></div>`
  },
  ai() {
    const items = P.items.map((it, i) => `<div class="row"><span>${esc(it)}</span><span>${['7.98','6.50','4.29','24.90','8.75','3.49','18.99','5.12'][i]}</span></div>`).join('')
    const spark = (l, t, s, o = 1) => `<div class="spark" style="left:${l}px;top:${t}px;opacity:${o}"><svg viewBox="0 0 24 24" width="${s}" height="${s}"><path fill="currentColor" d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12C11.4 17.8 6.2 12.6 0 12 6.2 11.4 11.4 6.2 12 0z"/></svg></div>`
    return `<div class="viewfinder">
        <div class="receipt"><div class="rh">${esc(P.merchant.toUpperCase())}</div><div class="rs">#0042 · ${esc(P.date)} · 6:42 PM</div><hr>
          ${items}<div class="row"><span>Tax</span><span>6.40</span></div><hr>
          <div class="row tot"><span>TOTAL</span><span>${esc(P.total)}</span></div><div class="bar"></div></div>
        <div class="beamglow"></div><div class="beam"></div>
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      </div>
      <svg class="arrow" viewBox="0 0 200 170" fill="none"><path d="M10 10 C 60 140, 120 150, 180 120" stroke="#FFB37A" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/><path d="M160 102 L182 120 L156 132" stroke="#FFB37A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ${spark(400, 420, 54)}${spark(470, 520, 26, .8)}${spark(30, 980, 34, .9)}${spark(560, 790, 30, .85)}${spark(330, 360, 20, .7)}
      <div class="entry"><div class="hd">${icon('sparkles', 20)}${esc(P.filled)}</div>
        <div class="amt">${esc(P.total)}</div>
        ${[[P.fields[1], '🛒 ' + P.category], [P.fields[2], P.date], [P.fields[3], P.merchant]].map(([k, v]) =>
          `<div class="f"><b>${esc(k)}</b><span class="v">${esc(v)}</span><span class="icon ok">${icon('check', 17)}</span></div>`).join('')}
      </div>
      <div class="chip pop splitchip">${icon('receipt-text', 20, '#FFB37A')}${esc(P.split)}</div>`
  },
  calendar() {
    return phone('calendar') + `<div class="pop" style="right:22px;top:1040px;padding:18px 22px;display:flex;gap:14px;align-items:center;transform:rotate(3deg)">
      <span class="icon" style="width:52px;height:52px;border-radius:16px;background:#EEE9FF;color:${T.accent}">${icon('refresh-cw', 26)}</span>
      <div><div style="font:800 21px Nunito">${esc(P.sync)}</div><div style="font:400 17px Hanken;color:#73695F">${esc(P.with)}</div></div></div>`
  },
  shopping() {
    // Pushed down so the store-chip row under the list (real chain names) stays off-canvas.
    return phone('shopping', 'top:436px') + `<div class="pop" style="left:20px;top:1010px;padding:16px 22px 16px 16px;display:flex;gap:14px;align-items:center;transform:rotate(-3deg)">
      <span style="width:56px;height:56px;border-radius:50%;background:#D9F1E4;color:#178A59;display:flex;align-items:center;justify-content:center;font:800 22px Nunito">${esc(P.who[0])}</span>
      <div><div style="font:400 18px Hanken"><b style="font-weight:600">${esc(P.who)}</b> ${esc(P.did)}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;font:800 21px Nunito;color:#178A59">${icon('check-check', 22)}${esc(P.item)} <span style="font:400 15px Hanken;color:#8a8078">· ${esc(P.when)}</span></div></div></div>`
  },
  money() {
    return phone('money') + `<div class="pop" style="right:18px;top:1060px;padding:18px 22px;transform:rotate(3deg);width:300px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font:600 18px Hanken">🛒 ${esc(P.label)}</span><span style="font:800 24px Nunito;color:#E4554A">${esc(P.amount)}</span></div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:8px;font:600 15px Hanken;color:${T.accent}">${icon('sparkles', 16)}${esc(P.note)}</div></div>`
  },
  location() { return phone('location') + notif(640, -2, P.msg) },
  nudges() { return phone('nudges') + notif(1150, 2, P.msg, P.from) },
  pets() {
    return phone('pets') + `<div class="pop" style="left:18px;top:1060px;padding:16px 22px 16px 16px;display:flex;gap:14px;align-items:center;transform:rotate(-3deg)">
      <span class="icon" style="width:52px;height:52px;border-radius:16px;background:#DDF3EE;color:${T.accent}">${icon('paw-print', 26)}</span>
      <div><div style="font:800 21px Nunito">${esc(P.title)}</div><div style="font:600 16px Hanken;color:#D2582F">${esc(P.due)}</div></div></div>`
  },
  docs() {
    return phone('docs') + `<div class="pop chip" style="right:26px;top:1080px;transform:rotate(4deg);padding:16px 22px;font-size:19px">${icon('scan-face', 26, T.accent)}${esc(P.lock)}</div>`
  },
  family() {
    return phone('family') + P.badges.map((b, i) => `<div class="pop chip" style="${i % 2 ? 'right:20px' : 'left:20px'};top:${1000 + i * 92}px;transform:rotate(${i % 2 ? 3 : -3}deg)">${icon(['shield-check', 'users', 'globe'][i], 22, T.accent)}${esc(b)}</div>`).join('')
  },
}
stage.innerHTML = html + LAYOUT[id]()

// Translations run longer than English: shrink the headline until it fits in
// two lines (≈140px at 62px/1.06) rather than letting a third line collide
// with the phone. Waits for the fonts so the measurement is the real one.
document.fonts.ready.then(() => {
  const h = document.querySelector('h1')
  let size = 62
  while (h.offsetHeight > 2 * size * 1.06 + 4 && size > 44) {
    size -= 2
    h.style.fontSize = size + 'px'
  }
})
</script>
</body></html>
