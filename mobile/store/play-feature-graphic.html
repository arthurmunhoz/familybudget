<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family:'Fraunces'; src:url('fraunces.woff2') format('woff2-variations'); font-weight:100 900; }
@font-face { font-family:'Hanken'; src:url('hanken.woff2') format('woff2-variations'); font-weight:100 900; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1024px; height:500px; overflow:hidden; }
.stage { position:relative; width:1024px; height:500px; background:#fbf6f0;
  background-image:
    radial-gradient(60% 90% at 92% 6%, rgba(194,96,63,.20) 0%, rgba(194,96,63,0) 60%),
    radial-gradient(70% 100% at 3% 100%, rgba(194,96,63,.12) 0%, rgba(194,96,63,0) 62%); }
/* One clay stroke arching over everything it covers — the name, drawn. */
.roof { position:absolute; left:520px; top:88px; width:456px; height:116px; }
.roof svg { display:block; width:100%; height:100%; }
.grid { position:absolute; left:546px; top:190px; width:404px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:18px 10px; }
.tile { display:flex; flex-direction:column; align-items:center; gap:8px; }
.ti { width:58px; height:58px; border-radius:18px; background:#fff; color:#c2603f;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(43,37,33,.09); border:1px solid rgba(43,37,33,.06); }
.tl { font-family:'Hanken'; font-weight:600; font-size:12.5px; color:#8c8076; }
.content { position:absolute; left:76px; top:50%; transform:translateY(-50%); width:430px; }
.lockup { display:flex; align-items:center; gap:16px; margin-bottom:22px; }
.mark { width:58px; height:58px; flex:none; }
.mark svg { display:block; width:100%; }
.name { font-family:'Fraunces'; font-weight:700; font-size:60px; line-height:1;
  color:#2b2521; letter-spacing:-1.2px; }
.tagline { font-family:'Hanken'; font-weight:500; font-size:26px; line-height:1.34;
  color:#6f6259; }
.rule { width:74px; height:5px; border-radius:3px; background:#c2603f; margin:26px 0 20px; }
.foot { font-family:'Hanken'; font-weight:600; font-size:15.5px; color:#8c8076; }
</style></head><body>
<div class="stage">
  <div class="roof">
    <svg viewBox="0 0 456 116" fill="none" stroke="#c2603f" stroke-width="13"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 102 L228 15 L442 102"/>
    </svg>
  </div>
  <div class="grid">
      <div class="tile"><span class="ti"><svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></span><span class="tl">Shopping</span></div>
      <div class="tile"><span class="ti"><svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span><span class="tl">Money</span></div>
      <div class="tile"><span class="ti"><svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg></span><span class="tl">Calendar</span></div>
      <div class="tile"><span class="ti"><svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg></span><span class="tl">Pet care</span></div>
      <div class="tile"><span class="ti"><svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></span><span class="tl">Whereabouts</span></div>
      <div class="tile"><span class="ti"><svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></span><span class="tl">Nudges</span></div>
      <div class="tile"><span class="ti"><svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="5" x="14" y="17" rx="1"/><path d="M10 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v2.5"/><path d="M20 17v-2a2 2 0 1 0-4 0v2"/></svg></span><span class="tl">Documents</span></div>
      <div class="tile"><span class="ti"><svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg></span><span class="tl">Family</span></div>
  </div>
  <div class="content">
    <div class="lockup">
      <div class="mark">
        <svg viewBox="0 0 100 100" fill="#c2603f"><path fill-rule="evenodd" d="M10,52 L50,14 L90,52 L78,52 L78,82 L58,82 L58,66 A8,8 0 0 0 42,66 L42,82 L22,82 L22,52 Z"/></svg>
      </div>
      <div class="name">One Roof</div>
    </div>
    <div class="tagline">Everything your household<br/>runs on, in one shared app.</div>
    <div class="rule"></div>
    <div class="foot">No ads. No tracking. Just your home.</div>
  </div>
</div>
</body></html>
