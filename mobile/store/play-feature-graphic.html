<!doctype html>
<html><head><meta charset="utf-8">
<!--
  Google Play feature graphic ("header"), 1024×500, for 1.6.0: Roof-forward.
  "Hey Roof" + the orb on the left, a phone (the Home) and a Modo Casa device
  on the right, on the brand's warm gradient. Play crops/overlays the edges
  (and may put a play button in the middle on some surfaces), so everything
  that matters sits inside a ~48px safe margin and nothing small is used:
  the smallest type is 26px. Rendered by render-feature-graphic.sh, which
  copies in icon.png, the fonts and the captures (hero.png, casa.png).
-->
<style>
@font-face { font-family:'Nunito'; src:url('nunito-800.ttf'); font-weight:800; }
@font-face { font-family:'Nunito'; src:url('nunito-700.ttf'); font-weight:700; }
@font-face { font-family:'Hanken'; src:url('hanken-600.ttf'); font-weight:600; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:500px; overflow:hidden; }
body { position:relative; font-family:'Hanken', sans-serif; color:#fff;
  background:linear-gradient(120deg, #FF9A5A 0%, #F2643F 38%, #D9446A 72%, #9B4FD6 100%); }
.glow { position:absolute; border-radius:50%; filter:blur(60px); }
.left { position:absolute; left:64px; top:70px; width:470px; z-index:5; }
.brand { display:flex; align-items:center; gap:14px; font:800 30px 'Nunito'; letter-spacing:-.3px; }
.brand img { width:54px; height:54px; border-radius:14px; box-shadow:0 8px 20px rgba(80,20,10,.3); }
h1 { margin-top:34px; display:flex; align-items:center; gap:20px; font:800 78px/1 'Nunito'; letter-spacing:-2px; white-space:nowrap; }
.orb { width:88px; height:88px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#8B6CFF,#20C3A6); box-shadow:0 0 0 8px rgba(255,255,255,.18), 0 16px 34px rgba(60,20,90,.45); }
.orb svg { width:46px; height:46px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.sub { margin-top:22px; font:700 32px/1.2 'Nunito'; color:rgba(255,255,255,.94); }
/* devices */
.device { position:absolute; z-index:2; background:#141211; box-shadow:0 30px 60px -10px rgba(60,10,30,.55); }
.device img { display:block; width:100%; height:100%; object-fit:cover; object-position:top; }
.casa { left:560px; top:96px; width:430px; height:290px; border-radius:22px; padding:10px; transform:rotate(-3deg); }
.casa img { border-radius:13px; }
.phone { left:796px; top:150px; width:176px; height:382px; border-radius:30px; padding:6px; z-index:3; transform:rotate(5deg); }
.phone img { border-radius:25px; }
.bubble { position:absolute; z-index:4; left:532px; top:330px; background:#fff; color:#241F1B; border-radius:24px;
  padding:14px 22px; font:700 26px 'Nunito'; box-shadow:0 16px 34px rgba(60,10,30,.35); transform:rotate(-2deg); white-space:nowrap; }
</style></head>
<body>
  <div class="glow" style="left:-120px;top:-160px;width:520px;height:520px;background:#FFC48A;opacity:.55"></div>
  <div class="glow" style="left:620px;top:220px;width:560px;height:520px;background:#7B5CFF;opacity:.45"></div>

  <div class="left">
    <div class="brand"><img src="icon.png" alt="">One Roof</div>
    <h1><span class="orb"><svg viewBox="0 0 24 24"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg></span>Hey Roof</h1>
    <div class="sub">Your family’s home,<br>run by voice.</div>
  </div>

  <div class="device casa"><img src="casa.png" alt=""></div>
  <div class="device phone"><img src="hero.png" alt=""></div>
  <div class="bubble">“What’s on today?”</div>
</body></html>
